upstream backend {
    least_conn;
    server 127.0.0.1:8001;
    server 127.0.0.1:8002;
}

upstream frontend {
    least_conn;
    server 127.0.0.1:8003;
    server 127.0.0.1:8004;
}


server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    location /status_back/ {
        proxy_pass http://backend/;
    }

    location /front/ {
        proxy_pass http://frontend/;
    }

   
}
